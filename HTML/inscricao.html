<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Inscrição</title>
</head>
<body>
    <h1>Formulário de Inscrição</h1>

    <form action="">
        <!-- Campo de Nome -->
         <label for="nome">Nome Completo:</label>
         <input type="text" id="nome" name="nome">
         <br><br>

        <!-- campo Email -->
         <label for="email">Email:</label>
         <input type="email" id="email" name="email">
         <br><br>

        <!-- Campo Whatsapp -->
         <label for="whatsapp">Whatsapp:</label>
         <input type="number" id="whatsapp" name="whatsapp">
         <br><br>

        <!-- Campo Área de Atuação -->
         <label>Área de Atuação:</label>
         <input type="radio" id="desenvolvimento" name="area" value="desenvolvimento">
         <label for=""desenvolvimento>Desenvolvimento</label>
         <input type="radio" id="quality" name="area" value="quality">
         <label for="quality">Quality Assurance (QA)</label>
         <br><br>

        <!-- Campo Observações -->
         
    </form>
</body>
</html>
