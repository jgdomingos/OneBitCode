<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>
<body>
    
    <table>
        <tr>
            <th>Coluna 1</th>
            <th>Coluna 2</th>
        </tr>
        <tr>
            <td>Dado 1</td>
            <td>Dado 2</td>
        </tr>
        <tr>
            <td>Dado 3</td>
            <td>Dado 4</td>
        </tr>
    </table>

    <hr>

    <h2>Tabelas com cabeçalhos</h2>
    <table>
        <thead>
            <tr>
            <th>Nome</th>
            <th>Idade</th>
            <th>Profissão</th>
        </tr>
        </thead>
        <tbody>
            <tr>
            <td>João Guilherme</td>
            <td>19</td>
            <td>Engenheiro de Software</td>
        </tr>
        <tr>
            <td>Geovana</td>
            <td>19</td>
            <td>Engenheira Civil</td>
        </tr>
        </tbody>
    </table>

    <hr>

    <h2>Tabelas com celulas personalizadas</h2>
    <table>
        <thead>
            <tr>
                <th colspan="2">Informações Pessoais</th>
                <th>Contato</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Nome:</td>
                <td>João</td>
                <td rowspan="2">Telefone: 1234567890</td>
            </tr>
            <tr>
                <td>Idade:</td>
                <td>19</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
